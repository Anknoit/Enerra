services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: openetrm
      POSTGRES_USER: openetrm
      POSTGRES_PASSWORD: openetrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openetrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openetrm:openetrm@db:5432/openetrm
      REDIS_URL: redis://:redispass@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles

  celery_worker:
    build: .
    command: celery -A config worker -l info -Q default,risk,settlements,market_data,credit,reporting,scheduling,integrations
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openetrm:openetrm@db:5432/openetrm
      REDIS_URL: redis://:redispass@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openetrm:openetrm@db:5432/openetrm
      REDIS_URL: redis://:redispass@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_files:
